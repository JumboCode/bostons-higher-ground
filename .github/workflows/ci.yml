name: CI

# Lint, test and build every push to, and pull request into, main and main-devops.
on:
    push:
        branches: [main, main-devops]
    pull_request:
        branches: [main, main-devops]
    workflow_dispatch:

permissions:
    contents: read

# A newer push to the same branch or PR cancels the older run.
concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: Lint, test and build
        runs-on: ubuntu-latest
        timeout-minutes: 20
        env:
            NEXT_TELEMETRY_DISABLED: "1"
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 12.14.0

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint
              run: pnpm lint

            # No DATABASE_URL here: tests/baseline-query.test.ts runs against a
            # live database whenever it is set, so it stays skipped in CI.
            - name: Test
              run: pnpm test

            - name: Build
              run: pnpm build
              env:
                  # Placeholders only. The app creates its database and auth
                  # clients when modules load, so `next build` needs these set,
                  # but nothing connects during the build. Never put real
                  # secrets here.
                  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
                  BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-at-runtime

            # After the build, because next-env.d.ts (image module types) is
            # generated by `next build` and is not committed.
            - name: Typecheck
              run: pnpm exec tsc --noEmit
